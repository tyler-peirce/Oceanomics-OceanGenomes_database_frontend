{% extends "base.html" %}

{% block title %}Delete Saved View | Oceanomics Database Explorer{% endblock %}

{% block content %}
<section class="panel panel-narrow">
    <div class="panel-header">
        <h2>Delete saved view</h2>
        <p>This removes <strong>{{ saved_view.name }}</strong> for <strong>{{ saved_view.table_name }}</strong>.</p>
    </div>

    <form method="post" class="actions-row">
        {% csrf_token %}
        <button type="submit" class="danger-btn">Delete</button>
        <a href="{% url 'saved_view_list' %}" class="ghost-btn">Cancel</a>
    </form>
</section>
{% endblock %}
